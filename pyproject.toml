[project]
name = "cortex"
version = "0.1.0"
description = "Social data export ingestion + vector knowledge base + RAG chat"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "google-cloud-aiplatform>=1.60.0",
    "ijson>=3.3.0",
    "beautifulsoup4>=4.12.0",
    "langdetect>=1.0.9",
    "tiktoken>=0.7.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN401",  # dynamically typed Any is acceptable in some contexts
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # no annotations required in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Integration tests share a module-level async engine; its asyncpg connections
# are bound to one event loop. Use a session-scoped loop so module fixtures and
# the tests that depend on them run on the SAME loop (asyncpg can't cross loops).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires running Postgres + Vertex AI",
]
